name: reviewer
version: "1.0"
expected_format: markdown
max_output_tokens: 4096
system: ""
template: |
  TASK: Review converted Synapse code against original Glue job.

  INPUT:
  Job: {{job_name}}
  Iteration: {{iteration}}

  Original Code:
  {{original_code}}

  Understanding:
  {{understanding_md}}

  Migration Plan:
  {{plan_md}}

  Converted Code:
  {{converted_code}}

  RULES:
  {{quality_rules}}

  OUTPUT: Review.md schema with Check Results table and Failed Sections JSON block.
  Failed Sections JSON format:
  ```json
  {
    "failed_sections": [
      {
        "check": "transformations",
        "line_start": 45,
        "line_end": 67,
        "issue": "description",
        "severity": "HIGH",
        "suggestion": "fix instruction"
      }
    ]
  }
  ```
